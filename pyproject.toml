[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "groundcheck-claim-verifier"
version = "2.0.0"
description = "Production-grade claim-level verification of AI-written analytics with AIML semantic attribution, FastAPI, Kubernetes, and CI/CD."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "SriRamKunamsetty", email = "mohansriramkunamsetty@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
]
aiml = [
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
]
postgres = [
    "psycopg[binary]>=3.1",
]
all = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "bandit>=1.7.8",
]

[project.scripts]
groundcheck = "groundcheck.cli:main"

[tool.setuptools.package-data]
groundcheck = ["schema.sql"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
