version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: groundcheck-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://groundcheck:groundcheck_secret@postgres:5432/groundcheck_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - groundcheck-net

  postgres:
    image: postgres:16-alpine
    container_name: groundcheck-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=groundcheck
      - POSTGRES_PASSWORD=groundcheck_secret
      - POSTGRES_DB=groundcheck_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundcheck -d groundcheck_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - groundcheck-net

  redis:
    image: redis:7-alpine
    container_name: groundcheck-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - groundcheck-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: groundcheck-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - groundcheck-net

  grafana:
    image: grafana/grafana:10.4.1
    container_name: groundcheck-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - groundcheck-net

networks:
  groundcheck-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
