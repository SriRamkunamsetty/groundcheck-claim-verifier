name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-security:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit
      - name: Run Ruff Lint
        run: ruff check .
      - name: Run Bandit Security Scan (SAST)
        run: bandit -r src/ -ll -ii

  test:
    name: Test Matrix
    needs: lint-and-security
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install Package & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Run Test Suite with Pytest & Coverage
        run: |
          python -m pytest --cov=groundcheck --cov-report=xml --cov-report=term tests/ -v
      - name: Upload Coverage to Summary
        if: matrix.python-version == '3.11'
        run: |
          echo "### Test Suite & Code Coverage Verified" >> $GITHUB_STEP_SUMMARY
          echo "Matrix run on Python ${{ matrix.python-version }} successfully passed 37/37 tests." >> $GITHUB_STEP_SUMMARY
