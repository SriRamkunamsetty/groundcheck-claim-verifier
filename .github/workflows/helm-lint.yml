name: Helm Chart Validation

on:
  push:
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm-lint.yml"
  pull_request:
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm-lint.yml"

jobs:
  lint-and-template:
    name: Helm Lint & Template Render Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.2

      - name: Helm Lint
        run: helm lint deploy/helm/groundcheck

      - name: Helm Template Dry Run
        run: |
          helm template groundcheck deploy/helm/groundcheck \
            --namespace groundcheck-prod \
            --set image.tag=2.0.0 \
            --debug > rendered-manifests.yaml
          echo "Successfully rendered Helm templates without syntax or rendering errors."
