{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "groundcheck.fullname" . }}
  labels:
    {{- include "groundcheck.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "groundcheck.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow outbound HTTPS for LLM APIs (Anthropic, Gemini, OpenAI)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # Allow internal Postgres traffic
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
