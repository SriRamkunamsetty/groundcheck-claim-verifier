apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: groundcheck-ingress
  namespace: groundcheck-prod
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - groundcheck.internal.example.com
      secretName: groundcheck-tls
  rules:
    - host: groundcheck.internal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: groundcheck-service
                port:
                  number: 8000
